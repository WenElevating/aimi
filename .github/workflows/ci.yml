name: ci
on: [push, pull_request]
jobs:
  server:
    # 服务端测试含 Windows 真实子进程用例（.cmd 垫片启动、PATH 分号语义、kill 进程树回收），
    # 且性能预算断言（延迟/洪水聚合/载荷截断）依赖 Windows 行为——只有 windows-latest 才能成为真门禁。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node tools/check-deps.mjs
      - run: pnpm typecheck
      - run: pnpm -r test
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        # 固定为本仓开发所用版本，避免 stable 漂移引入未验证的行为差异
        with: { channel: stable, flutter-version: 3.41.2 }
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
